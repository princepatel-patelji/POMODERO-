<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FocusFlow — Study Smart. Focus Deep.</title>
  <meta name="description" content="Pomodoro timer, study tasks, history and analytics. Local-first, offline-ready, installable.">
  <meta name="theme-color" content="#0e1017" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FocusFlow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>
    // Apply theme before first paint (no flash)
    try {
      var t = localStorage.getItem('ff-theme');
      var eff = (t === 'light' || t === 'dark') ? t :
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = eff;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <div class="brand-txt"><strong>FocusFlow</strong><span>Study smart. Focus deep.</span></div>
      </div>
      <nav class="nav" id="nav-desktop"></nav>
      <div class="side-foot">
        <button class="btn ghost sm" data-ffinstall>Install app</button>
        <p class="micro">Local-first · your data stays in this browser</p>
      </div>
    </aside>
    <div class="maincol">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="top-actions">
          <span class="chip streak" id="streakChip" title="Current study streak">0</span>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
          <button class="icon-btn desktop-only" id="shortcutsBtn" aria-label="Keyboard shortcuts" title="Shortcuts (?)"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="bottomnav" id="bottomnav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="toasts" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
